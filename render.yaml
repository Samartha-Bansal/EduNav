services:
  - type: web
    name: edunavigator-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LOW_MEMORY_MODE
        value: "true"
      - key: ENABLE_RERANK
        value: "false"
      - key: EAGER_LOAD_ENGINE
        value: "false"
      - key: RETRIEVAL_TOP_K
        value: "8"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: PYTORCH_NUM_THREADS
        value: "1"
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOW_ORIGINS
        sync: false
